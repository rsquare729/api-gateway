server:
  port: 9090

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users,/users/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders,/orders/**

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 52.66.188.57

  client:
    service-url:
      defaultZone: http://52.66.188.57:8761/eureka